[package]
name = "ds-cost-harness"
version = "0.1.0"
edition = "2021"
description = "Cost-aware stress/verification harness for the DS Build DeepSeek pipeline: real `ds` sessions, token/cost accounting via ds-models pricing, headroom ON/OFF savings A/B, wire-contract assertions through shipped functions."
license = "Apache-2.0"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"] }

ds-models = { path = "../../crates/codegen/ds-models" }
ds-headroom = { path = "../../crates/codegen/ds-headroom" }
ds-sampling-types = { path = "../../crates/codegen/ds-sampling-types" }
ds-tools = { path = "../../crates/codegen/ds-tools" }

[[bin]]
name = "cost-harness"
path = "src/main.rs"
