# =============================================================================
# DS Build — DeepSeek V4 config template
# =============================================================================
#
# SETUP
#   1. Get a key:  https://platform.deepseek.com/api_keys   (starts with sk-)
#   2. Copy this file:
#        mkdir -p ~/.ds
#        cp config.example.toml ~/.ds/config.toml
#        chmod 600 ~/.ds/config.toml
#   3. Paste your key into BOTH [model.*] api_key lines below
#   4. Run:  ds -p "Reply with exactly: DEEPSEEK_OK" --model deepseek-v4-flash
#
# IMPORTANT
#   - Use singular  [model.deepseek-v4-pro]   ← correct
#   - Do NOT use    [models.deepseek-v4-pro]  ← ignored for credentials
#   - Keep this file out of git (it lives in ~/.ds/)
#
# ALTERNATIVE TO api_key IN THIS FILE
#   export DEEPSEEK_API_KEY="sk-..."
#   (a [model.*] api_key in this file still wins over the env var — per-model
#    keys are the most specific; env is the fallback. Local-model entries
#    rely on this: api_key = "local" must beat DEEPSEEK_API_KEY.)
#
# Full guide: DEEPSEEK.md
# =============================================================================

[auth]
preferred_method = "api_key"

[ui]
permission_mode = "always-approve"

[subagents]
enabled = true

[endpoints]
ds_api_base_url = "https://api.deepseek.com/v1"

# DeepSeek thinking depth (reasoning_effort). Highest by default.
[models]
default_reasoning_effort = "max"

# -----------------------------------------------------------------------------
# PASTE YOUR DEEPSEEK API KEY BELOW (same key in both blocks is fine)
# -----------------------------------------------------------------------------

[model.deepseek-v4-pro]
api_key = "sk-PASTE_YOUR_DEEPSEEK_API_KEY_HERE"
base_url = "https://api.deepseek.com/v1"
api_backend = "responses"
supports_backend_search = true
context_window = 1000000
supports_reasoning_effort = true
reasoning_effort = "max"
reasoning_efforts = ["high", "max"]

[model.deepseek-v4-flash]
api_key = "sk-PASTE_YOUR_DEEPSEEK_API_KEY_HERE"
base_url = "https://api.deepseek.com/v1"
api_backend = "responses"
supports_backend_search = true
context_window = 1000000
supports_reasoning_effort = true
reasoning_effort = "max"
reasoning_efforts = ["high", "max"]

# -----------------------------------------------------------------------------
# Optional: local Qwen3.8-27B Uncensored (MLX). See LOCAL.md
#   ds local setup && ds local download && ds local serve --bits 4
# 4-bit is the right default on a 32 GB Mac. 2-bit is not offered.
# -----------------------------------------------------------------------------
#
# [model.qwen3-8-27b-4bit]
# model = "/Users/jake/models/Qwen3.8-27B-Uncensored-MLX/4-bit"
# base_url = "http://127.0.0.1:8080/v1"
# name = "Qwen 4-bit (local)"
# use_concise = true
# api_key = "local"
# api_backend = "chat_completions"
# context_window = 49152          # written by `ds local setup` from RAM + KV
# max_completion_tokens = 8192    # scaled to context_window / 4
# inference_idle_timeout_secs = 600
# supports_reasoning_effort = false
# supports_backend_search = false
# stream_tool_calls = false

[features]
telemetry = false

[telemetry]
mixpanel_enabled = false
trace_upload = false
otel_enabled = false
